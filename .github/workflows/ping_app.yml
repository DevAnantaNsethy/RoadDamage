name: Ping Streamlit App

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    name: Ping deployed Streamlit app
    steps:
      - name: Ping app URL
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then
            echo "Error: STREAMLIT_APP_URL secret is not set. Set it in your repository settings and redeploy.";
            exit 1;
          fi
          echo "Pinging $APP_URL"
          curl -fsS --max-time 10 "$APP_URL" || echo "Ping failed, but workflow will exit successfully."
